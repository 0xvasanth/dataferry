[package]
name = "ferry-cli"
description = "The ferry command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["command-line-utilities", "database"]

[lints]
workspace = true

[features]
default = ["postgres", "mongo"]
# The built-in connectors (0004 §5). `postgres` brings ferry-state's
# Postgres state backend with it, so a run can keep its state in a
# postgres connection.
postgres = ["dep:ferry-connector-postgres", "ferry-state/postgres"]
mongo = ["dep:ferry-connector-mongo"]

[dependencies]
ferry-core.workspace = true
ferry-dsl.workspace = true
ferry-registry.workspace = true
# `run`: the runner (A5), the file state backend (A4), the verifier (A8).
ferry-runtime.workspace = true
ferry-state.workspace = true
ferry-verify.workspace = true
ferry-connector-postgres = { workspace = true, optional = true }
ferry-connector-mongo = { workspace = true, optional = true }
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
schemars = "1"
serde_json = "1"
# `signal`: Ctrl-C stops a run with exit 130. `time`: releasing its leases
# is bounded.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[dev-dependencies]
assert_cmd = "2"
# A sink type with no verifier, for the unverified-sink test.
ferry-core = { workspace = true, features = ["testkit"] }
# The built-ins by name, for the tests that register them again.
ferry-connector-mongo.workspace = true
ferry-connector-postgres.workspace = true
ferry-state = { workspace = true, features = ["postgres"] }
# The conformance suite (`testkit::conformance`) and its chaos harness.
ferry-runtime = { workspace = true, features = ["testkit"] }
insta = "1"
# The plan and run tests: real Mongo and Postgres on testcontainers.
mongodb = "3"
# The README's connector example (tests/readme_connector.rs), and the
# unverified-sink test's sink type.
serde = { version = "1", features = ["derive"] }
tempfile = "3"
testcontainers-modules.workspace = true
tokio.workspace = true
tokio-postgres = "0.7"

[[bin]]
name = "ferry"
path = "src/main.rs"
