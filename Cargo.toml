[workspace]
resolver = "3"
members = [
    "crates/ferry-core",
    "crates/ferry-registry",
    "crates/ferry-dsl",
    "crates/ferry-connectors/tls",
    "crates/ferry-connectors/postgres",
    "crates/ferry-connectors/mongo",
    "crates/ferry-state",
    "crates/ferry-runtime",
    "crates/ferry-verify",
    "crates/ferry-cli",
    "crates/ferry-cli/tests/acme-ferry",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
# The DataFusion pin (ferry-dsl, and ferry-cli through it) needs 1.95, and
# every crate declares the same minimum. CI builds the workspace with it.
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/0xvasanth/ferry"
homepage = "https://github.com/0xvasanth/ferry"
readme = "README.md"
keywords = ["migration", "etl", "postgres", "mongodb", "arrow"]
categories = ["database"]

[workspace.dependencies]
ferry-core = { version = "0.0.1", path = "crates/ferry-core" }
ferry-dsl = { version = "0.0.1", path = "crates/ferry-dsl" }
ferry-registry = { version = "0.0.1", path = "crates/ferry-registry" }
ferry-state = { version = "0.0.1", path = "crates/ferry-state" }
ferry-runtime = { version = "0.0.1", path = "crates/ferry-runtime" }
ferry-verify = { version = "0.0.1", path = "crates/ferry-verify" }
ferry-connector-tls = { version = "0.0.1", path = "crates/ferry-connectors/tls" }
ferry-connector-postgres = { version = "0.0.1", path = "crates/ferry-connectors/postgres" }
ferry-connector-mongo = { version = "0.0.1", path = "crates/ferry-connectors/mongo" }

# DataFusion for the expression language (ferry-dsl expr). Pinned to a commit
# on main: no DataFusion release is built on arrow 60 yet (55.2 uses arrow
# 59, and main moved to arrow 60 in apache/datafusion#25335). Switch to the
# first release on arrow 60 (expected: 56) once it is out. All crates must
# come from the same rev.
datafusion-common = { version = "55.1.0", git = "https://github.com/apache/datafusion", rev = "1da3cf049fa1a7a708acc2c29eba4f2e9dece8db", default-features = false }
datafusion-expr = { version = "55.1.0", git = "https://github.com/apache/datafusion", rev = "1da3cf049fa1a7a708acc2c29eba4f2e9dece8db", default-features = false }
datafusion-functions = { version = "55.1.0", git = "https://github.com/apache/datafusion", rev = "1da3cf049fa1a7a708acc2c29eba4f2e9dece8db", default-features = false, features = ["string_expressions", "unicode_expressions"] }
datafusion-functions-nested = { version = "55.1.0", git = "https://github.com/apache/datafusion", rev = "1da3cf049fa1a7a708acc2c29eba4f2e9dece8db", default-features = false }
datafusion-optimizer = { version = "55.1.0", git = "https://github.com/apache/datafusion", rev = "1da3cf049fa1a7a708acc2c29eba4f2e9dece8db", default-features = false }
datafusion-physical-expr = { version = "55.1.0", git = "https://github.com/apache/datafusion", rev = "1da3cf049fa1a7a708acc2c29eba4f2e9dece8db", default-features = false }
datafusion-sql = { version = "55.1.0", git = "https://github.com/apache/datafusion", rev = "1da3cf049fa1a7a708acc2c29eba4f2e9dece8db", default-features = false, features = ["unicode_expressions"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "mongo"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
