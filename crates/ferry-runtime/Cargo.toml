[package]
name = "ferry-runtime"
description = "The 0xferry runner: lease, read, transform, write and commit each partition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# The kill -9 chaos harness (`testkit::chaos`), for this crate's tests and
# for end-to-end tests that rerun it against a real sink, and the connector
# conformance suite built on it (`testkit::conformance`).
testkit = ["dep:fastrand", "tokio/process"]

[dependencies]
ferry-core.workspace = true
ferry-registry.workspace = true
ferry-state.workspace = true
# chrono-tz: raw records with named time zones ("UTC") render as JSON.
arrow-array = { version = "60", features = ["chrono-tz"] }
arrow-json = "60"
arrow-schema = "60"
arrow-select = "60"
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
fastrand = { version = "2", optional = true }

[dev-dependencies]
ferry-runtime = { path = ".", features = ["testkit"] }
ferry-core = { workspace = true, features = ["testkit"] }
# A3's sink, for the chaos run through the real Postgres sink.
ferry-connector-postgres.workspace = true
ferry-state = { workspace = true, features = ["postgres", "testkit"] }
deadpool-postgres = "0.14"
peak_alloc = "0.3"
tempfile = "3"
tokio = { workspace = true, features = ["process", "test-util"] }
tokio-postgres = "0.7"
testcontainers-modules.workspace = true
