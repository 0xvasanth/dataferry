[workspace]
resolver = "3"
members = [
    "crates/ferry-core",
    "crates/ferry-registry",
    "crates/ferry-dsl",
    "crates/ferry-connectors/tls",
    "crates/ferry-connectors/postgres",
    "crates/ferry-connectors/mongo",
    "crates/ferry-state",
    "crates/ferry-runtime",
    "crates/ferry-verify",
    "crates/ferry-cli",
    "crates/ferry-cli/tests/acme-ferry",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
# DataFusion 55.2 (ferry-dsl, and ferry-cli through it) needs 1.94, the
# highest minimum in the dependency tree, and every crate declares the same
# one. CI builds the workspace with it.
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/0xvasanth/ferry"
homepage = "https://github.com/0xvasanth/ferry"
readme = "README.md"
keywords = ["migration", "etl", "postgres", "mongodb", "arrow"]
categories = ["database"]

[workspace.dependencies]
ferry-core = { version = "0.0.1", path = "crates/ferry-core" }
ferry-dsl = { version = "0.0.1", path = "crates/ferry-dsl" }
ferry-registry = { version = "0.0.1", path = "crates/ferry-registry" }
ferry-state = { version = "0.0.1", path = "crates/ferry-state" }
ferry-runtime = { version = "0.0.1", path = "crates/ferry-runtime" }
ferry-verify = { version = "0.0.1", path = "crates/ferry-verify" }
ferry-connector-tls = { version = "0.0.1", path = "crates/ferry-connectors/tls" }
ferry-connector-postgres = { version = "0.0.1", path = "crates/ferry-connectors/postgres" }
ferry-connector-mongo = { version = "0.0.1", path = "crates/ferry-connectors/mongo" }

# DataFusion for the expression language (ferry-dsl expr). 55.2 is built on
# arrow 59, so every arrow-* dependency in the workspace stays on 59 with it:
# two arrow majors in one build don't interoperate. Move DataFusion and arrow
# together (DataFusion 56 is expected on arrow 60). All datafusion-* crates
# must be the same version.
datafusion-common = { version = "55.2.0", default-features = false }
datafusion-expr = { version = "55.2.0", default-features = false }
datafusion-functions = { version = "55.2.0", default-features = false, features = ["string_expressions", "unicode_expressions"] }
datafusion-functions-nested = { version = "55.2.0", default-features = false }
datafusion-optimizer = { version = "55.2.0", default-features = false }
datafusion-physical-expr = { version = "55.2.0", default-features = false }
datafusion-sql = { version = "55.2.0", default-features = false, features = ["unicode_expressions"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "mongo"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
