[package]
name = "ferry-state"
description = "Run, partition and lease state store for 0xferry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The state store contract suite (`check_state_store`).
testkit = []

[dependencies]
ferry-core.workspace = true
ferry-registry.workspace = true
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ferry-state = { path = ".", features = ["testkit"] }
ferry-core = { workspace = true, features = ["testkit"] }
ferry-dsl.workspace = true
tempfile = "3"
tokio.workspace = true
