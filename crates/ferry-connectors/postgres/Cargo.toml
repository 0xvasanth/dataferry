[package]
name = "ferry-connector-postgres"
description = "Postgres source and sink for 0xferry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ferry-core.workspace = true
arrow-array = "60"
arrow-buffer = "60"
arrow-schema = "60"
async-trait = "0.1"
futures = "0.3"
postgres-protocol = "0.6"
tokio = { version = "1", features = ["rt"] }
tokio-postgres = "0.7"

[dev-dependencies]
ferry-core = { workspace = true, features = ["testkit"] }
tokio.workspace = true
testcontainers-modules.workspace = true
