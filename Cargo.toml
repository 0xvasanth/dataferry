[workspace]
resolver = "3"
members = [
    "crates/dataferry-core",
    "crates/dataferry-registry",
    "crates/dataferry-dsl",
    "crates/dataferry-connectors/tls",
    "crates/dataferry-connectors/postgres",
    "crates/dataferry-connectors/mongo",
    "crates/dataferry-state",
    "crates/dataferry-runtime",
    "crates/dataferry-verify",
    "crates/dataferry",
    "crates/dataferry/tests/acme-dataferry",
]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
# DataFusion 55.2 (dataferry-dsl, and dataferry through it) needs 1.94, the
# highest minimum in the dependency tree, and every crate declares the same
# one. CI builds the workspace with it.
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/0xvasanth/dataferry"
# The user guide.
homepage = "https://0xvasanth.github.io/dataferry/"
readme = "README.md"
keywords = ["migration", "etl", "postgres", "mongodb", "arrow"]
categories = ["database"]

[workspace.dependencies]
# The crates of one release depend on each other at exactly that version
# (`=`), so a published crate never mixes with another release's. Bump these
# with [workspace.package] version (RELEASING.md).
dataferry-core = { version = "=0.1.0-beta.1", path = "crates/dataferry-core" }
dataferry-dsl = { version = "=0.1.0-beta.1", path = "crates/dataferry-dsl" }
dataferry-registry = { version = "=0.1.0-beta.1", path = "crates/dataferry-registry" }
dataferry-state = { version = "=0.1.0-beta.1", path = "crates/dataferry-state" }
dataferry-runtime = { version = "=0.1.0-beta.1", path = "crates/dataferry-runtime" }
dataferry-verify = { version = "=0.1.0-beta.1", path = "crates/dataferry-verify" }
dataferry-connector-tls = { version = "=0.1.0-beta.1", path = "crates/dataferry-connectors/tls" }
dataferry-connector-postgres = { version = "=0.1.0-beta.1", path = "crates/dataferry-connectors/postgres" }
dataferry-connector-mongo = { version = "=0.1.0-beta.1", path = "crates/dataferry-connectors/mongo" }

# DataFusion for the expression language (dataferry-dsl expr). 55.2 is built on
# arrow 59, so every arrow-* dependency in the workspace stays on 59 with it:
# two arrow majors in one build don't interoperate. Move DataFusion and arrow
# together (DataFusion 56 is expected on arrow 60). All datafusion-* crates
# must be the same version.
datafusion-common = { version = "55.2.0", default-features = false }
datafusion-expr = { version = "55.2.0", default-features = false }
datafusion-functions = { version = "55.2.0", default-features = false, features = ["string_expressions", "unicode_expressions"] }
datafusion-functions-nested = { version = "55.2.0", default-features = false }
datafusion-optimizer = { version = "55.2.0", default-features = false }
datafusion-physical-expr = { version = "55.2.0", default-features = false }
datafusion-sql = { version = "55.2.0", default-features = false, features = ["unicode_expressions"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "mongo"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
