name: Release

# Pushing a `v*` tag (v0.1.0-beta.1) releases that version: binaries for
# four targets, a GitHub Release with the CHANGELOG section as its notes
# (a pre-release when the version has a `-` suffix), then every crate on
# crates.io in dependency order. RELEASING.md has the whole procedure.
#
# Every job is safe to re-run: the release's assets are replaced, and
# crates already on crates.io at this version are skipped.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time per tag; a second push of the same tag waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails before anything is built or published: the tag must match the
  # workspace version, CHANGELOG.md must have that version's section, the
  # user guide must be live, and the crates.io token must be there.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - id: version
        run: |
          version=$(scripts/release.py check-tag "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ $version == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - run: scripts/release.py notes "$VERSION" > notes.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
      # crates.io keeps each version's homepage link for good.
      - name: The user guide is live
        run: |
          homepage=$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "dataferry") | .homepage')
          if ! curl --silent --show-error --fail --location --output /dev/null "$homepage"; then
            echo "::error::the homepage $homepage doesn't answer: publish the user guide first (RELEASING.md)"
            exit 1
          fi
      - name: CARGO_REGISTRY_TOKEN is set
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z $CARGO_REGISTRY_TOKEN ]]; then
            echo "::error::the CARGO_REGISTRY_TOKEN repository secret is not set (RELEASING.md)"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  # Native runners for every target but x86_64-apple-darwin, which Apple's
  # toolchain cross-builds on the arm64 runner. Linux builds on Ubuntu
  # 22.04, so the binaries run on glibc 2.35 and newer.
  build:
    needs: check
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            runs: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            runs: true
          - target: x86_64-apple-darwin
            os: macos-latest
            runs: false
          - target: aarch64-apple-darwin
            os: macos-latest
            runs: true
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup target add "$TARGET"
      - run: cargo build --release --locked -p dataferry --target "$TARGET"
      - name: The binary reports the tagged version
        if: matrix.runs
        run: |
          out=$("target/$TARGET/release/dataferry" --version)
          echo "$out"
          if [[ $out != "dataferry $VERSION" ]]; then
            echo "::error::expected \`dataferry $VERSION\`, got \`$out\`"
            exit 1
          fi
      - name: Archive and checksum
        run: |
          name="dataferry-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/dataferry" LICENSE README.md CHANGELOG.md "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  # Creates the release, or replaces its assets on a re-run.
  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Assets
        run: |
          mv dist/notes.md notes.md
          cd dist
          cat ./*.tar.gz.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          ls -l
          count=$(find . -name '*.tar.gz' | wc -l)
          if [[ $count -ne 4 ]]; then
            echo "::error::expected 4 archives, found $count"
            exit 1
          fi
      - name: GitHub Release
        run: |
          flags=()
          if [[ $PRERELEASE == true ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
              --notes-file notes.md "${flags[@]}"
          fi

  # Last, because it can't be undone: by now every target has built. Each
  # `cargo publish` builds its crate from the tarball first.
  publish:
    needs: release
    runs-on: ubuntu-latest
    # A first release waits out crates.io's new-crate rate limit (about ten
    # minutes a crate after the first few).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: scripts/release.py order
      - run: scripts/release.py publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
