version: 2
updates:
  # Rust crates: one weekly PR with every compatible update, so CI checks
  # them together.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    # DataFusion and arrow move together: DataFusion 55.2 is built on
    # arrow 59, and an arrow major on its own would put two arrows in the
    # build (their arrays don't interoperate). A DataFusion major moves to
    # a new arrow too, so neither major is bumped here: upgrade both by
    # hand in one change (Cargo.toml explains). Minor and patch updates
    # still come through.
    ignore:
      - dependency-name: "arrow-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "datafusion-*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # dtolnay/rust-toolchain's tags are Rust versions, not action
    # releases: the msrv job pins @1.94 on purpose.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns: ["*"]
