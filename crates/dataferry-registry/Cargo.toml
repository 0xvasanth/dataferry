[package]
name = "dataferry-registry"
description = "Connector registry, connection options and the state-capable extension for dataferry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# The connector contract suite (`check_connector`, `check_state_capable`).
testkit = ["dataferry-core/testkit"]

[dependencies]
dataferry-core.workspace = true
arrow-array = "59"
arrow-schema = "59"
async-trait = "0.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"

[dev-dependencies]
dataferry-registry = { path = ".", features = ["testkit"] }
dataferry-core = { workspace = true, features = ["testkit"] }
futures = "0.3"
jsonschema = { version = "0.58", default-features = false }
serde_norway = "0.9"
tokio.workspace = true
trybuild = "1"
