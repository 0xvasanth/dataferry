version: 2
updates:
  # Rust crates: one weekly PR with every compatible update, so CI checks
  # them together.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    # DataFusion is a git pin until it releases on arrow 60 (README,
    # Publishing); a registry bump would take it back to arrow 59.
    ignore:
      - dependency-name: "datafusion-*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # dtolnay/rust-toolchain's tags are Rust versions, not action
    # releases: the msrv job pins @1.95 on purpose.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns: ["*"]
