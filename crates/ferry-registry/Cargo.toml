[package]
name = "ferry-registry"
description = "Connector registry, connection options and the state-capable extension for 0xferry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ferry-core.workspace = true
async-trait = "0.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"

[dev-dependencies]
ferry-core = { workspace = true, features = ["testkit"] }
arrow-array = "60"
futures = "0.3"
jsonschema = { version = "0.58", default-features = false }
serde_norway = "0.9"
tokio.workspace = true
trybuild = "1"
