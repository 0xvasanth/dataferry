[package]
name = "ferry-connector-mongo"
description = "MongoDB source for 0xferry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["migration", "etl", "mongodb", "mongo", "arrow"]
categories.workspace = true

[lints]
workspace = true

[dependencies]
ferry-core.workspace = true
ferry-connector-tls.workspace = true
ferry-registry.workspace = true
arrow-array = "59"
arrow-buffer = "59"
arrow-schema = "59"
async-trait = "0.1"
futures = "0.3"
mongodb = "3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
ferry-core = { workspace = true, features = ["testkit"] }
ferry-registry = { workspace = true, features = ["testkit"] }
tokio.workspace = true
testcontainers-modules.workspace = true
rcgen = "0.14"
