[package]
name = "ferry-state"
description = "Run, partition and lease state store for 0xferry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# The state store kept in the state connection's Postgres database
# (`PgStateBackend`, 0004 §8).
postgres = ["dep:deadpool-postgres", "dep:tokio-postgres"]
# The state store contract suite (`check_state_store`), and the file
# store's test hooks (a slow write, waiting for dropped calls).
testkit = []

[dependencies]
ferry-core.workspace = true
ferry-registry.workspace = true
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
deadpool-postgres = { version = "0.14", optional = true }
# The file store runs its blocking I/O on tokio's blocking pool.
tokio = { version = "1", features = ["rt", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"], optional = true }

[dev-dependencies]
ferry-state = { path = ".", features = ["postgres", "testkit"] }
ferry-core = { workspace = true, features = ["testkit"] }
ferry-registry = { workspace = true, features = ["testkit"] }
# Path only, no version: ferry-dsl depends on this crate (through
# ferry-runtime), so `cargo package` drops this dev-dependency and this
# crate can be published before it.
ferry-dsl = { path = "../ferry-dsl" }
arrow-array = "59"
futures = "0.3"
schemars = "1"
tempfile = "3"
tokio.workspace = true
testcontainers-modules.workspace = true
