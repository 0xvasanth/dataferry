[package]
name = "dataferry-dsl"
description = "dataferry configuration model, expression language and planner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
arrow-array = "59"
arrow-buffer = "59"
arrow-cast = "59"
arrow-ipc = "59"
arrow-ord = "59"
arrow-row = "59"
arrow-schema = "59"
arrow-select = "59"
async-trait = "0.1"
datafusion-common.workspace = true
datafusion-expr.workspace = true
datafusion-functions.workspace = true
datafusion-functions-nested.workspace = true
datafusion-optimizer.workspace = true
datafusion-physical-expr.workspace = true
datafusion-sql.workspace = true
dataferry-core.workspace = true
dataferry-registry.workspace = true
dataferry-runtime.workspace = true
dataferry-verify.workspace = true
futures = "0.3"
glob = "0.3"
# YAML 1.2 event parser with positions; the maintained successor of
# yaml-rust (serde_yaml is archived). See config/yaml.rs.
saphyr-parser = "0.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Staged joins spill to a temporary directory (B6).
tempfile = "3"
# `$key`: UUIDv5 child keys (B5).
# Merges sort and read their stages on tokio's blocking pool.
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", default-features = false, features = ["std", "v5"] }

[dev-dependencies]
arrow-json = "59"
async-trait = "0.1"
dataferry-core = { workspace = true, features = ["testkit"] }
dataferry-connector-postgres.workspace = true
# The golden dead letters end to end: the Mongo source on a real Mongo.
dataferry-connector-mongo.workspace = true
mongodb = "3"
dataferry-state = { workspace = true, features = ["postgres"] }
deadpool-postgres = "0.14"
testcontainers-modules.workspace = true
tokio-postgres = "0.7"
proptest = "1"
insta = "1"
jsonschema = { version = "0.58", default-features = false }
# The staged merge's peak heap (tests/merge_memory.rs), as dataferry-runtime measures it.
peak_alloc = "0.3"
# The round-trip test reads serialized JSON back, and column order matters.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { workspace = true, features = ["time"] }
