[package]
name = "ferry-state"
description = "Run, partition and lease state store for 0xferry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The state store kept in the state connection's Postgres database
# (`PgStateBackend`, 0004 §8).
postgres = ["dep:deadpool-postgres", "dep:tokio", "dep:tokio-postgres"]
# The state store contract suite (`check_state_store`).
testkit = []

[dependencies]
ferry-core.workspace = true
ferry-registry.workspace = true
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
deadpool-postgres = { version = "0.14", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"], optional = true }

[dev-dependencies]
ferry-state = { path = ".", features = ["postgres", "testkit"] }
ferry-core = { workspace = true, features = ["testkit"] }
ferry-registry = { workspace = true, features = ["testkit"] }
ferry-dsl.workspace = true
arrow-array = "60"
futures = "0.3"
schemars = "1"
tempfile = "3"
tokio.workspace = true
testcontainers-modules.workspace = true
