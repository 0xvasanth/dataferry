[workspace]
resolver = "3"
members = [
    "crates/ferry-core",
    "crates/ferry-registry",
    "crates/ferry-dsl",
    "crates/ferry-connectors/tls",
    "crates/ferry-connectors/postgres",
    "crates/ferry-connectors/mongo",
    "crates/ferry-state",
    "crates/ferry-runtime",
    "crates/ferry-verify",
    "crates/ferry-cli",
    "crates/ferry-cli/tests/acme-ferry",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/0xvasanth/ferry"

[workspace.dependencies]
ferry-core = { path = "crates/ferry-core" }
ferry-dsl = { path = "crates/ferry-dsl" }
ferry-registry = { path = "crates/ferry-registry" }
ferry-state = { path = "crates/ferry-state" }
ferry-runtime = { path = "crates/ferry-runtime" }
ferry-verify = { path = "crates/ferry-verify" }
ferry-connector-tls = { path = "crates/ferry-connectors/tls" }
ferry-connector-postgres = { path = "crates/ferry-connectors/postgres" }
ferry-connector-mongo = { path = "crates/ferry-connectors/mongo" }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "mongo"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
