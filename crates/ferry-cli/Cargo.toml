[package]
name = "ferry-cli"
description = "The ferry command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["postgres", "mongo"]
# The built-in connectors (0004 §5). TODO(C1 follow-up): `builtins.rs`
# registers them once their `Connector` impls land from track A.
postgres = ["dep:ferry-connector-postgres"]
mongo = ["dep:ferry-connector-mongo"]

[dependencies]
ferry-dsl.workspace = true
ferry-registry.workspace = true
ferry-connector-postgres = { workspace = true, optional = true }
ferry-connector-mongo = { workspace = true, optional = true }
clap = { version = "4", features = ["derive", "env"] }
schemars = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[[bin]]
name = "ferry"
path = "src/main.rs"
