[package]
name = "ferry-core"
description = "Core types and contracts shared by every 0xferry crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Generic contract suites and in-memory connectors for tests.
testkit = ["dep:arrow-select"]

[dependencies]
arrow-schema = "60"
arrow-array = "60"
arrow-select = { version = "60", optional = true }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
ferry-core = { path = ".", features = ["testkit"] }
tokio.workspace = true
serde_json = "1"
