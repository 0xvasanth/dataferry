[package]
name = "ferry-verify"
description = "The 0xferry verifier: read-time counts, multiset checksums, constraint checks and the run report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ferry-core.workspace = true
ferry-registry.workspace = true
ferry-runtime.workspace = true
ferry-connector-postgres.workspace = true
arrow-array = "60"
arrow-buffer = "60"
arrow-schema = "60"
async-trait = "0.1"
deadpool-postgres = "0.14"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_128"] }

[dev-dependencies]
ferry-core = { workspace = true, features = ["testkit"] }
ferry-state = { workspace = true, features = ["postgres"] }
serde_json = "1"
arrow-select = "60"
tempfile = "3"
tokio.workspace = true
testcontainers-modules.workspace = true
